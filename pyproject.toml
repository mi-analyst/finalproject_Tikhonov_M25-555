[tool.poetry]
name = "valutatrade-hub"
version = "1.0.0"
description = "Professional Currency Trading System"
authors = ["Mikhail Tikhonov <student@example.com>"]
readme = "README.md"
packages = [{include = "valutatrade_hub"}]

[tool.poetry.dependencies]
python = "^3.10"
prettytable = "^3.10.0"
requests = "^2.31.0" 
python-dotenv = "^1.0.0"

[tool.poetry.scripts]
project = "main:main"

[tool.poetry.group.dev.dependencies]
ruff = "^0.3.0"
pytest = "^8.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 145
target-version = "py310"
exclude = ["venv", ".venv", "dist", "pycache"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[tool.trade_sync]
rates_ttl_seconds = 600
default_base_currency = "USD"
data_directory = "data"